name: Transfer the checked files to Maven Central
description: >-
  Downloads the frozen publication package of java/finalize-publication, verifies it and transfers
  its central/ files: a release as one Portal bundle with publishingType=AUTOMATIC (no validation
  polling), a snapshot through maven-deploy-plugin:deploy-file, skipped when another run already
  transferred a newer commit. Nothing is rebuilt or re-signed. Needs a checkout (the JDK pin); the
  snapshot job needs actions: read and a concurrency group of its own.
inputs:
  channel:
    description: snapshot or release.
    required: true
  assets-complete:
    description: The assets_complete output of the publish job (must be 'true').
    required: true
  username:
    description: Central Portal token username (pass a secret).
    required: true
  password:
    description: Central Portal token password (pass a secret).
    required: true
  skip-superseded:
    description: For a snapshot, skip the transfer when another run transferred a newer commit.
    required: false
    default: 'true'
  job-name:
    description: The name this job has, looked for in other runs to find a newer snapshot transfer.
    required: false
    default: Upload checked snapshot artifacts to Maven Central
  java-version-file:
    description: The JDK pin Maven runs with.
    required: false
    default: .java-version
  java-distribution:
    description: The JDK distribution.
    required: false
    default: temurin
  github-token:
    description: Token for reading other runs (superseded check).
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Require the completed gate
      shell: bash
      env:
        COMPLETE: ${{ inputs.assets-complete }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        case "$CHANNEL" in snapshot|release) ;; *) echo "::error::Invalid publication channel"; exit 1 ;; esac
        if [ "$COMPLETE" != "true" ]; then echo "::error::the publication gate did not complete"; exit 1; fi
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        java-version-file: ${{ inputs.java-version-file }}
        distribution: ${{ inputs.java-distribution }}
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: signed-${{ inputs.channel }}-assets
        path: publication-package/
        digest-mismatch: error
    - name: Transfer frozen artifacts (no rebuild, signing or validation polling)
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../lib
        CHANNEL: ${{ inputs.channel }}
        SKIP: ${{ inputs.skip-superseded }}
        JOB_NAME: ${{ inputs.job-name }}
        GH_TOKEN: ${{ inputs.github-token }}
        MAVEN_USERNAME: ${{ inputs.username }}
        MAVEN_PASSWORD: ${{ inputs.password }}
      run: |
        set -euo pipefail
        args=(upload publication-package)
        if [ "$CHANNEL" = "snapshot" ] && [ "$SKIP" = "true" ]; then
          args+=(--skip-superseded --job-name "$JOB_NAME")
        fi
        python3 -m actionlib.java.publication "${args[@]}"
