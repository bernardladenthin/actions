# REUSE compliance of the calling repository (and of this one, on its own pushes).
# Caller: templates/common/.github/workflows/reuse.yml.
name: REUSE Compliance Check
on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
