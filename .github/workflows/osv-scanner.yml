# OSV-Scanner over the calling repository: Google's reusable workflows, the PR variant on pull
# requests (only new findings), the full scan otherwise. The event is the caller's.
# Caller: templates/common/.github/workflows/osv-scanner.yml (it grants security-events: write).
name: OSV-Scanner
on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
