# The library tests (lib/tests: the checks, the publication, the templates, and the structure of
# every action and reusable workflow) on the oldest Python the library supports and on the
# runners' own, and bash -n over every run script of this repository's actions and workflows.
# REUSE runs from reuse.yml, which is also a reusable workflow.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Library tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s lib/tests -t lib -v
      - name: Run scripts of the actions and workflows parse
        env:
          PYTHONPATH: lib
        run: python -m actionlib.common.runscripts
