name: Check files against the templates
description: >-
  Fails when a file the repository carries (community files, licenses, editor and Maven settings,
  Dependabot, workflow callers) differs from its template in templates/<set>/ of this repository.
  The sets, exclusions and relocations are the templates section of .github/actions-config.json;
  {{owner}}/{{repo}} and the refs of uses: lines may differ. See lib/actionlib/common/templates.py.
inputs:
  config:
    description: Configuration file, relative to the repository (default .github/actions-config.json).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../lib
        CONFIG: ${{ inputs.config }}
      run: python3 -m actionlib.common.templates ${CONFIG:+--config "$CONFIG"}
